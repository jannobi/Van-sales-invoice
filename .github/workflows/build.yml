name: Build Debug APK for Testing

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
    
    - name: Install Dependencies
      run: |
        cd backend
        npm install
    
    - name: Create Build
      run: |
        mkdir -p build-output
        cp -r backend/src build-output/
        cp backend/package.json build-output/
        cp backend/server.js build-output/
        echo "Build completed successfully!"
    
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-build
        path: build-output/
        retention-days: 30
